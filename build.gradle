plugins {
    id 'fabric-loom' version '1.16.3'
    id 'maven-publish'
}

// Minecraft, Fabric API and Java versions of the build target, see gradle.properties
def target = file("versions/${project.mc}.properties")
if (!target.exists()) {
    def known = file("versions").list().findAll { it.endsWith(".properties") }.collect { it - ".properties" }.sort()
    throw new GradleException("Unknown Minecraft version ${project.mc}, known: ${known.join(", ")}")
}
def targetProperties = new Properties()
target.withInputStream { targetProperties.load(it) }
targetProperties.each { key, value -> project.ext.set(key, value) }

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    // Optional workaround for Windows JDK loopback failures in WEPollSelectorImpl.
    // Enable with: gradlew runClient -PwindowsSelector
    if (providers.gradleProperty('windowsSelector').isPresent()
            && System.getProperty('os.name').startsWith('Windows')) {
        runs {
            client {
                vmArg '-Djava.nio.channels.spi.SelectorProvider=sun.nio.ch.WindowsSelectorProvider'
            }
        }
    }

    mods {
        "bbs_lip_sync" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modImplementation files("libs/bbs-${project.bbs_version}-${project.minecraft_version}.jar")

    // Vosk (Kaldi) speech recognition, bundled into the mod jar (jar-in-jar). The jar carries the
    // natives for Windows x64, Linux x64 and macOS (Intel + Apple Silicon); its only dependency,
    // JNA, ships with Minecraft itself.
    implementation("com.alphacephei:vosk:${project.vosk_version}") { transitive = false }
    include "com.alphacephei:vosk:${project.vosk_version}"
}

tasks.withType(ProcessResources).configureEach {
    def replacements = [
            "version"             : project.version,
            "minecraft_dependency": project.minecraft_dependency,
            "loader_version"      : project.loader_version,
            "java_version"        : project.java_version
    ]
    inputs.properties replacements
    filteringCharset "UTF-8"

    filesMatching(["fabric.mod.json", "*.mixins.json"]) {
        expand replacements
    }
}

def targetJavaVersion = project.java_version as int
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE.txt") {
        rename { "LICENSE_${project.archives_base_name}.txt" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
